# Use these location blocks inside the existing server { ... } block for
# prasadweerasinghe.auricodesolutions.com. Replace the site's current
# location / block; do not leave two location / blocks in the same server.

location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

location / {
    try_files $uri $uri/ /index.html;
}
